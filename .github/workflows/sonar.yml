name: SonarQube

# SonarQube解析は無効化中。
# 再有効化する場合は、以下の push / pull_request のコメントを外す。
on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
